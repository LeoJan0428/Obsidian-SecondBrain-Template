name: Vault Governance & Health CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest ruff

      - name: Run ruff lint
        run: ruff check scripts/ tests/

      - name: Validate Git hook shell syntax
        run: bash -n 00-AgentOS/hooks/pre-commit 00-AgentOS/hooks/commit-msg

      - name: Run vault governance audit
        run: python scripts/audit_vault.py

      - name: Run pytest health suite
        run: PYTHONPATH=. pytest tests/ -q
